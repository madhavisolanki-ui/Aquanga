version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aquanga_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquanga_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquanga_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aquanga_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquanga_user} -d ${POSTGRES_DB:-aquanga_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aquanga_fastapi
    restart: always
    command: >
      sh -c "python scripts/train.py &&
             python scripts/seed_database.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aquanga_user}:${POSTGRES_PASSWORD:-aquanga_secure_pass}@db:5432/${POSTGRES_DB:-aquanga_db}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  dashboard:
    build: .
    container_name: aquanga_streamlit
    restart: always
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aquanga_user}:${POSTGRES_PASSWORD:-aquanga_secure_pass}@db:5432/${POSTGRES_DB:-aquanga_db}
    depends_on:
      - api
    volumes:
      - ./data:/app/data
      - ./models:/app/models

volumes:
  postgres_data:
